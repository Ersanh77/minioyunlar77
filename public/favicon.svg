<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Warm Amber / Orange) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gamepad Body Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#78350f" flood-opacity="0.35" />
    </filter>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.3" />

  <!-- Playful Decorative Circles -->
  <circle cx="96" cy="96" r="28" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="430" cy="420" r="40" fill="#ffffff" fill-opacity="0.15" />

  <!-- Shining Game Star at Top Right -->
  <g filter="url(#starShadow)">
    <path d="M 370 70 L 382 105 L 418 105 L 388 126 L 399 160 L 370 138 L 341 160 L 352 126 L 322 105 L 358 105 Z" fill="url(#starGrad)" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Cute Gamepad Body with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main Gamepad Contour -->
    <path d="
      M 160 210
      C 200 210, 220 230, 256 230
      C 292 230, 312 210, 352 210
      C 420 210, 440 260, 430 330
      C 420 400, 370 420, 335 385
      L 305 350
      C 285 330, 227 330, 207 350
      L 177 385
      C 142 420, 92 400, 82 330
      C 72 260, 92 210, 160 210
      Z
    " fill="url(#padGrad)" stroke="#e5e7eb" stroke-width="6" />

    <!-- D-Pad (Left Cross Controller) -->
    <g fill="#6366f1">
      <!-- Horizontal bar -->
      <rect x="130" y="275" width="60" height="22" rx="6" />
      <!-- Vertical bar -->
      <rect x="149" y="256" width="22" height="60" rx="6" />
      <!-- Center pivot dot -->
      <circle cx="160" cy="286" r="4" fill="#4338ca" />
    </g>

    <!-- Action Buttons (Right colorful circular buttons) -->
    <circle cx="352" cy="262" r="13" fill="#ef4444" /> <!-- Red Top (Y) -->
    <circle cx="326" cy="288" r="13" fill="#3b82f6" /> <!-- Blue Left (X) -->
    <circle cx="378" cy="288" r="13" fill="#10b981" /> <!-- Green Right (B) -->
    <circle cx="352" cy="314" r="13" fill="#f59e0b" /> <!-- Yellow Bottom (A) -->

    <!-- Center Menu Pill Buttons -->
    <rect x="230" y="270" width="20" height="8" rx="4" fill="#9ca3af" />
    <rect x="262" y="270" width="20" height="8" rx="4" fill="#9ca3af" />

    <!-- Cheerful Smiley Mouth on Gamepad Center -->
    <path d="M 238 298 Q 256 312 274 298" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
